name: Kanagawa reservation watch
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan检查网页 / check检查并通知 / test测试 / set_range改日期 / enable启用 / pause暂停'
        required: true
        default: check
        type: choice
        options: [scan, check, test, set_range, enable, pause]
      end_date:
        description: '仅set_range需要填写，例如2026-11-16'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: kanagawa-reservation-monitor
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser and dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate notification logic
        run: python -m unittest test_cloud -v
      - name: Check reservations or update settings
        if: inputs.mode != 'scan'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
          NEW_END_DATE: ${{ inputs.end_date }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python cloud_monitor.py
      - name: Verify live calendar without sending notifications
        if: inputs.mode == 'scan'
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from calendar_scan import scan
          settings = json.load(open('settings.json'))
          days = scan(datetime.now(ZoneInfo('Asia/Tokyo')).date(), date.fromisoformat(settings['end_date']))
          print('Available large-motorcycle dates:', ', '.join(days) or 'none')
          PY
